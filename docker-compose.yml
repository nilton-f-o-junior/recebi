services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
    volumes:
      - .:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4173/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    restart: unless-stopped

  cypress:
    image: cypress/included:16.1.0
    profiles: ["test"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      # localhost evita o bloqueio de Local Network Access do Chrome 142+;
      # o Cypress compartilha a rede do app para alcançar o nginx.
      - CYPRESS_baseUrl=http://localhost:4173
      - CI=1
    network_mode: "service:app"
    working_dir: /e2e
    volumes:
      - .:/e2e
    user: "${UID:-1000}:${GID:-1000}"
    entrypoint: ["cypress", "run"]
    command: []
    restart: "no"
